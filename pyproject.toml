[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.2.0"
description = "Local macro dashboard on public data only (FRED, Treasury, NY Fed, BoK ECOS, ECB, BIS, OECD)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "streamlit>=1.57",
]

[project.optional-dependencies]
# AI analysis is optional; install only the providers you use.
claude = ["anthropic>=1.13.0"]
openai = ["openai>=3.30.0"]
gemini = ["google-genai>=2.30.1"]
llm = ["finagent[claude,openai,gemini]"]
# S&P 500 screening, portfolios and the dashboard's gold row (yfinance, unofficial
# Yahoo data); see the README.
screen = [
    "lxml>=6.1.3",
    "yfinance>=1.7.0",
]

[project.scripts]
macro = "finagent.cli:main"

[dependency-groups]
dev = [
    # The adapters and the screener are type-checked against the real packages.
    "finagent[llm]",
    "finagent[screen]",
    "basedpyright>=1.21",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # User-facing Korean messages are written inline at the raise site, and
    # labels use the typographic minus sign.
    "EM101",
    "EM102",
    "RUF001",
    "TRY003",
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "INP001", "PLC0415", "PLR2004", "S101", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]
