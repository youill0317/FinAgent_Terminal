[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
headingFont = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = true
paddingTop = "0.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#1C1917"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F4"
codeBackgroundColor = "#F5F5F4"
textColor = "#1C1917"
linkColor = "#1C1917"
borderColor = "#D6D3D1"
codeTextColor = "#44403C"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
blueColor = "#1D4ED8"
violetColor = "#7C3AED"
grayColor = "#78716C"
chartCategoricalColors = [
    "#1D4ED8",
    "#059669",
    "#7C3AED",
    "#DC2626",
    "#D97706",
    "#0284C7",
    "#78716C",
    "#EA580C",
]
chartSequentialColors = [
    "#F0F9FF",
    "#E0F2FE",
    "#BAE6FD",
    "#7DD3FC",
    "#38BDF8",
    "#0EA5E9",
    "#0284C7",
    "#0369A1",
    "#075985",
    "#0C4A6E",
]
dataframeBorderColor = "#D6D3D1"
dataframeHeaderBackgroundColor = "#E7E5E4"
dataframeHeaderTextColor = "#1C1917"

[theme.dark]
primaryColor = "#F5F5F4"
backgroundColor = "#1C1917"
secondaryBackgroundColor = "#292524"
codeBackgroundColor = "#292524"
